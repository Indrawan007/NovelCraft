[package]
name = "novelcraft"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "markdown", "highlighter"] }
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
epub = "2.1.5"
html2text = "0.12"
roxmltree = "0.20"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
