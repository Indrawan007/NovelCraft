name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev desktop-file-utils
      - name: Validate desktop entry and icon
        run: |
          desktop-file-validate packaging/novelcraft.desktop
          python3 -c 'import configparser; c=configparser.ConfigParser(interpolation=None); c.read("packaging/novelcraft.desktop"); e=c["Desktop Entry"]; assert e["Exec"] == "novelcraft %f"; assert set(e["MimeType"].split(";")) >= {"application/epub+zip", "text/plain", "text/markdown"}'
          python3 -c 'import xml.etree.ElementTree as ET; assert ET.parse("packaging/novelcraft.svg").getroot().tag == "{http://www.w3.org/2000/svg}svg"'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Run tests
        run: |
          set +e
          cargo test --locked --all-targets > "$RUNNER_TEMP/novelcraft-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/novelcraft-tests.log"
          if [ "$status" -ne 0 ]; then
            diagnostic=$(sed -n '/^failures:/,$p' "$RUNNER_TEMP/novelcraft-tests.log" | head -c 3000)
            if [ -z "$diagnostic" ]; then
              diagnostic=$(tail -n 20 "$RUNNER_TEMP/novelcraft-tests.log" | head -c 3000)
            fi
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=Rust tests failed::%s\n' "$diagnostic"
          fi
          exit "$status"
      - name: Temporary visual inspection
        run: |
          exec 3>&1 4>&2
          exec > "$RUNNER_TEMP/visual-step.log" 2>&1
          set -E
          on_error() {
            diagnostic=$(tail -n 40 "$RUNNER_TEMP/visual-step.log" | tail -c 5000)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=Visual failure::%s\n' "$diagnostic" >&3
          }
          trap on_error ERR
          sudo apt-get install -y xvfb xdotool imagemagick mesa-vulkan-drivers
          cargo build --locked
          export WINIT_UNIX_BACKEND=x11
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config" XDG_DATA_HOME="$RUNNER_TEMP/data"
          xvfb-run -a -s '-screen 0 1100x750x24' bash -c '
            target/debug/novelcraft > "$RUNNER_TEMP/gui.log" 2>&1 &
            app=$!
            sleep 12
            if ! kill -0 "$app"; then cat "$RUNNER_TEMP/gui.log"; exit 1; fi
            window=$(xdotool search --name NovelCraft | head -1)
            xdotool windowactivate --sync "$window" 2>/dev/null || xdotool windowfocus --sync "$window"
            xdotool key ctrl+2
            sleep 3
            xdotool mousemove 1000 700
            import -window root -colors 64 PNG8:"$RUNNER_TEMP/reader.png"
            xdotool key ctrl+m
            sleep 2
            import -window root -colors 64 PNG8:"$RUNNER_TEMP/menu.png"
            xdotool key ctrl+comma
            sleep 2
            import -window root -colors 64 PNG8:"$RUNNER_TEMP/settings.png"
            kill "$app"
          '
          exec 1>&3 2>&4
          for name in reader menu settings; do
            encoded=$(base64 -w 0 "$RUNNER_TEMP/$name.png")
            python3 - "$name" "$encoded" <<'PY'
          import sys
          name, data = sys.argv[1:]
          print(f'::notice title=VISUAL_{name}_COUNT::{(len(data)+4999)//5000}')
          for i in range(0, len(data), 5000):
              print(f'::notice title=VISUAL_{name}_{i//5000}::{data[i:i+5000]}')
          PY
          done
