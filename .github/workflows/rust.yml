name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libwayland-dev libxkbcommon-dev desktop-file-utils
      - name: Validate desktop entry and icon
        run: |
          desktop-file-validate packaging/novelcraft.desktop
          python3 -c 'import configparser; c=configparser.ConfigParser(interpolation=None); c.read("packaging/novelcraft.desktop"); e=c["Desktop Entry"]; assert e["Exec"] == "novelcraft %f"; assert set(e["MimeType"].split(";")) >= {"application/epub+zip", "text/plain", "text/markdown"}'
          python3 -c 'import xml.etree.ElementTree as ET; assert ET.parse("packaging/novelcraft.svg").getroot().tag == "{http://www.w3.org/2000/svg}svg"'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Temporary: resolve the new dependency and export its lockfile for this environment.
      - name: Resolve dependencies
        run: cargo update --workspace
      - name: Prepare lockfile export
        run: |
          gzip -n -9 -c Cargo.lock | base64 -w 0 > "$RUNNER_TEMP/novelcraft-lock.b64"
          split -b 3000 -d -a 3 "$RUNNER_TEMP/novelcraft-lock.b64" "$RUNNER_TEMP/lock-chunk-"
          count=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'lock-chunk-*' | wc -l)
          test "$count" -le 32
          printf '::notice title=lock-sha256::%s\n' "$(sha256sum Cargo.lock | cut -d' ' -f1)"
      - name: Export lockfile part 1
        run: |
          for i in {0..7}; do
            printf -v n '%03d' "$i"
            file="$RUNNER_TEMP/lock-chunk-$n"
            if [ -f "$file" ]; then
              printf '::notice title=lock-%s::%s\n' "$n" "$(cat "$file")"
            fi
          done
      - name: Export lockfile part 2
        run: |
          for i in {8..15}; do
            printf -v n '%03d' "$i"
            file="$RUNNER_TEMP/lock-chunk-$n"
            if [ -f "$file" ]; then
              printf '::notice title=lock-%s::%s\n' "$n" "$(cat "$file")"
            fi
          done
      - name: Export lockfile part 3
        run: |
          for i in {16..23}; do
            printf -v n '%03d' "$i"
            file="$RUNNER_TEMP/lock-chunk-$n"
            if [ -f "$file" ]; then
              printf '::notice title=lock-%s::%s\n' "$n" "$(cat "$file")"
            fi
          done
      - name: Export lockfile part 4
        run: |
          for i in {24..31}; do
            printf -v n '%03d' "$i"
            file="$RUNNER_TEMP/lock-chunk-$n"
            if [ -f "$file" ]; then
              printf '::notice title=lock-%s::%s\n' "$n" "$(cat "$file")"
            fi
          done
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Run tests
        run: |
          set +e
          cargo test --locked --all-targets > "$RUNNER_TEMP/novelcraft-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/novelcraft-tests.log"
          if [ "$status" -ne 0 ]; then
            diagnostic=$(sed -n '/^failures:/,$p' "$RUNNER_TEMP/novelcraft-tests.log" | head -c 3000)
            if [ -z "$diagnostic" ]; then
              diagnostic=$(tail -n 20 "$RUNNER_TEMP/novelcraft-tests.log" | head -c 3000)
            fi
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=Rust tests failed::%s\n' "$diagnostic"
          fi
          exit "$status"
